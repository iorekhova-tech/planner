<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Планер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ============ THEME TOKENS ============ */
  :root{
    --radius:18px; --radius-sm:12px; --radius-xs:8px;
    --font-display:"Cormorant Garamond",serif;
    --font-body:"Manrope",system-ui,sans-serif;
  }
  [data-theme="light"]{
    --bg:#EEF1EB; --surface:#FFFFFF; --surface-2:#F4F6F1; --surface-3:#E9EDE5;
    --ink:#28322B; --muted:#6E7A70; --faint:#A2AC9E; --line:#E0E5DB;
    --shadow:0 1px 2px rgba(40,50,43,.05), 0 10px 28px rgba(40,50,43,.07);
    --red-mark:#D8503E;
  }
  [data-theme="dark"]{
    --bg:#1B211D; --surface:#242B25; --surface-2:#2B332C; --surface-3:#333C34;
    --ink:#EAEFE6; --muted:#A6B0A0; --faint:#6C766B; --line:#3A433B;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 10px 30px rgba(0,0,0,.35);
    --red-mark:#E97A68;
  }
  /* accent gradients: two stops + a solid for text/icons, tuned per theme for contrast */
  [data-accent="green"]{ --ac1:#7FA088; --ac2:#557B62; --ac-solid:#4F7359; --ac-solid-dark:#9CC1A6; --ac-soft:#E4EEE6; }
  [data-accent="blue"]{  --ac1:#7FA8C9; --ac2:#4E7DA3; --ac-solid:#3E6D93; --ac-solid-dark:#9CC3E3; --ac-soft:#E3ECF3; }
  [data-accent="pink"]{  --ac1:#D79AB0; --ac2:#B96E8C; --ac-solid:#A85E7C; --ac-solid-dark:#E3AFC2; --ac-soft:#F4E5EA; }
  [data-accent="gray"]{  --ac1:#ADB0B2; --ac2:#82868A; --ac-solid:#6C7074; --ac-solid-dark:#C9CCCE; --ac-soft:#EAEAEA; }
  [data-theme="dark"] { --ac-text:var(--ac-solid-dark); }
  [data-theme="light"]{ --ac-text:var(--ac-solid); }
  [data-theme="dark"] [data-accent]{ --ac-soft:rgba(255,255,255,.06); }

  *{box-sizing:border-box;margin:0;padding:0}
  html{min-height:100%}
  html,body{color:var(--ink);font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;line-height:1.5;transition:background .35s ease,color .2s ease}
  html{background:linear-gradient(160deg, var(--bg) 0%, var(--ac-soft) 55%, var(--bg) 100%) fixed;
    background-color:var(--bg)}
  body{background:transparent}
  body{padding:20px 16px 90px;max-width:780px;margin:0 auto}
  @media (min-width:720px){body{padding:32px 26px 60px}}
  h1,h2,h3{font-family:var(--font-display);font-weight:500;letter-spacing:.2px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink);background:transparent}
  ::selection{background:var(--ac-soft)}
  :focus-visible{outline:2px solid var(--ac-solid);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  .grad{background:linear-gradient(135deg,var(--ac1),var(--ac2))}

  /* ---------- topbar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .controls{display:flex;align-items:center;gap:10px}
  .swatch-row{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:4px;box-shadow:var(--shadow)}
  .swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;transition:.15s}
  .swatch[data-a="green"]{background:linear-gradient(135deg,#7FA088,#557B62)}
  .swatch[data-a="blue"]{background:linear-gradient(135deg,#7FA8C9,#4E7DA3)}
  .swatch[data-a="pink"]{background:linear-gradient(135deg,#D79AB0,#B96E8C)}
  .swatch[data-a="gray"]{background:linear-gradient(135deg,#ADB0B2,#82868A)}
  .swatch.sel{border-color:var(--ink)}
  .theme-btn{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--shadow)}

  /* ---------- header ---------- */
  header{margin-bottom:16px}
  .greeting{font-size:13.5px;color:var(--muted);letter-spacing:.3px}
  .today-date{font-family:var(--font-display);font-size:clamp(28px,7vw,42px);font-weight:500;line-height:1.05;margin-top:2px}
  .today-date .day-word{font-style:italic;color:var(--ac-text)}

  /* ---------- motivation popup ---------- */
  .motiv-overlay{position:fixed;inset:0;background:rgba(20,26,20,.42);display:flex;align-items:center;
    justify-content:center;z-index:50;padding:24px;backdrop-filter:blur(2px)}
  .motiv-card{background:var(--surface);border-radius:20px;padding:30px 26px;max-width:340px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.25);position:relative}
  .motiv-card .mark{width:34px;height:34px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(135deg,var(--ac1),var(--ac2))}
  .motiv-card p{font-family:var(--font-display);font-style:italic;font-size:21px;line-height:1.4;color:var(--ink)}
  .motiv-card .close{margin-top:20px;background:linear-gradient(135deg,var(--ac1),var(--ac2));color:#fff;
    padding:9px 22px;border-radius:999px;font-size:13.5px;font-weight:700}

  /* ---------- cards ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  .card-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .card-title h2{font-size:22px}
  .card-title .count{font-size:12.5px;color:var(--faint);font-weight:600}
  .back{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--muted);font-size:14px;font-weight:600}
  .back:hover{color:var(--ink)}

  /* ---------- task rows ---------- */
  .row{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--surface-2)}
  .row:last-child{border-bottom:none}
  .check{flex:0 0 auto;width:21px;height:21px;border-radius:50%;border:1.8px solid var(--line);
    margin-top:1px;transition:.15s;position:relative;background:var(--surface)}
  .check.on{background:linear-gradient(135deg,var(--ac1),var(--ac2));border-color:transparent}
  .check.on::after{content:"";position:absolute;left:6px;top:2.5px;width:5px;height:9.5px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg)}
  .row .body{flex:1;min-width:0}
  .row .txt{font-size:15px}
  .row.done .txt{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line)}
  .meta-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
  .chip.deadline{color:var(--ac-text);background:var(--ac-soft)}
  .chip.pr-low{color:#5E8069}
  .chip.pr-medium{color:#B5892E}
  .chip.pr-high{color:#C1554A}
  .chip.st-todo{background:var(--surface-2)}
  .chip.st-progress{background:var(--ac-soft);color:var(--ac-text)}
  .chip.st-done{background:var(--surface-3);color:var(--faint);text-decoration:line-through}
  .del{opacity:0;color:var(--faint);font-size:18px;line-height:1;padding:2px 6px;transition:.15s}
  .row:hover .del{opacity:1}
  .del:hover{color:#C1554A}

  /* ---------- add task form ---------- */
  .add-toggle{display:flex;align-items:center;gap:8px;color:var(--ac-text);font-weight:700;font-size:14px;
    padding:8px 0;margin-top:4px}
  .add-form{display:none;flex-direction:column;gap:8px;margin-top:10px;background:var(--surface-2);
    border-radius:var(--radius-sm);padding:14px}
  .add-form.open{display:flex}
  .add-form input.text{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-xs);padding:10px 12px}
  .add-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .add-grid input,.add-grid select{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-xs);padding:9px 10px;font-size:13.5px}
  .newcat-row{display:none;gap:6px;grid-column:1/-1}
  .newcat-row.open{display:flex}
  .newcat-row input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-xs);padding:9px 10px;font-size:13.5px}
  .newcat-row button{background:linear-gradient(135deg,var(--ac1),var(--ac2));color:#fff;border-radius:var(--radius-xs);padding:0 14px;font-size:13px;font-weight:700}
  .add-btn{background:linear-gradient(135deg,var(--ac1),var(--ac2));color:#fff;border-radius:var(--radius-xs);
    padding:10px;font-weight:700;font-size:14px;text-align:center}
  .empty{color:var(--faint);font-size:14px;font-style:italic;font-family:var(--font-display);padding:6px 0}

  /* ---------- mini calendar ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-head h2{font-size:20px;text-transform:capitalize}
  .nav-btn{width:30px;height:30px;border-radius:50%;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted);transition:.15s}
  .nav-btn:hover{background:linear-gradient(135deg,var(--ac1),var(--ac2));color:#fff}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-wd{text-align:center;font-size:10.5px;color:var(--faint);text-transform:uppercase;font-weight:700;padding-bottom:3px}
  .cal-cell{aspect-ratio:1;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;
    justify-content:center;font-size:13px;position:relative;transition:.12s;border:1px solid transparent}
  .cal-cell.blank{background:transparent}
  .cal-cell:not(.blank):hover{background:var(--surface-3)}
  .cal-cell.sel{background:linear-gradient(135deg,var(--ac1),var(--ac2));color:#fff;font-weight:700}
  .cal-cell .dot{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--ac-text)}
  .cal-cell.sel .dot{background:#fff}
  .today-mark{position:absolute;top:-3px;bottom:-3px;left:-10px;right:-10px;pointer-events:none;z-index:1}
  .today-mark svg{width:100%;height:100%}
  .day-panel{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
  .day-panel h3{font-size:18px;text-transform:capitalize;margin-bottom:8px}

  /* ---------- hub tiles ---------- */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
  .tile{border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);color:#fff;position:relative;
    overflow:hidden;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
  .tile:active{transform:scale(.98)}
  .tile .ic{font-size:20px;opacity:.95}
  .tile .lbl{font-family:var(--font-display);font-size:19px;font-weight:600}
  .tile .sub{font-size:11.5px;opacity:.85;font-weight:600}
  .tile.t1{background:linear-gradient(135deg,var(--ac1),var(--ac2))}
  .tile.t2{background:linear-gradient(150deg, color-mix(in srgb, var(--ac1) 55%, white 45%), color-mix(in srgb, var(--ac2) 60%, white 25%))}
  .tile.t3{background:linear-gradient(150deg, color-mix(in srgb, var(--ac2) 75%, black 12%), color-mix(in srgb, var(--ac1) 55%, black 25%))}
  .tile.t4{background:linear-gradient(150deg, var(--ac2), var(--ac1))}

  /* ---------- habits ---------- */
  .habit{padding:16px 0;border-bottom:1px solid var(--surface-2)}
  .habit:last-child{border-bottom:none}
  .habit-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
  .habit-name-input{font-size:15px;font-weight:700;border:none;background:transparent;flex:1;min-width:0}
  .habit-pct{font-size:13px;font-weight:800;color:var(--ac-text);white-space:nowrap}
  .habit-grid{display:flex;flex-wrap:wrap;gap:5px}
  .hdot{width:16px;height:16px;border-radius:50%;border:1.4px solid var(--line);background:var(--surface);transition:.13s;flex:0 0 auto}
  .hdot.on{background:linear-gradient(135deg,var(--ac1),var(--ac2));border-color:transparent;transform:scale(1.08)}
  .hdot.today{box-shadow:0 0 0 2px var(--ac-soft)}
  .habit-sub{font-size:11.5px;color:var(--faint);margin-bottom:8px}
  .streak-badge{display:inline-block;font-size:12.5px;font-weight:800;color:var(--ac-text);
    background:var(--ac-soft);border-radius:999px;padding:3px 11px;margin:2px 0 10px}
  .kind-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);margin-bottom:2px}

  .water-row{display:flex;align-items:center;gap:16px;margin-bottom:12px}
  .water-glass{width:56px;height:74px;flex:0 0 auto;border:2px solid var(--line);border-radius:5px 5px 13px 13px;
    position:relative;overflow:hidden;background:var(--surface-2)}
  .water-fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--ac1),var(--ac2));transition:height .3s ease}
  .water-info{flex:1}
  .water-amt{font-family:var(--font-display);font-size:22px;font-weight:600}
  .water-goal{font-size:12px;color:var(--faint)}
  .water-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .qbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--muted);transition:.14s}
  .qbtn:hover{background:linear-gradient(135deg,var(--ac1),var(--ac2));color:#fff;border-color:transparent}

  .steps-info{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .steps-amt{font-family:var(--font-display);font-size:22px;font-weight:600}
  .steps-goal{font-size:12px;color:var(--faint)}
  .steps-path{position:relative;height:30px;margin:4px 4px 12px}
  .steps-track{position:absolute;top:50%;left:0;right:0;height:2px;background:var(--line);transform:translateY(-50%)}
  .steps-track .pt{position:absolute;top:50%;width:7px;height:7px;border-radius:50%;background:var(--faint);transform:translate(-50%,-50%)}
  .steps-track .ptA{left:0}
  .steps-track .ptB{left:100%}
  .steps-walker{position:absolute;top:50%;font-size:17px;transform:translate(-50%,-58%) scaleX(-1);transition:left .3s ease}
  .steps-input-row{display:flex;gap:8px}
  .steps-input-row input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-xs);padding:8px 10px}
  .steps-input-row button{background:linear-gradient(135deg,var(--ac1),var(--ac2));color:#fff;border-radius:var(--radius-xs);padding:0 16px;font-weight:700;font-size:13px}

  .water-manual{display:flex;gap:6px;margin-top:8px}
  .water-manual input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-xs);padding:8px 10px;font-size:13.5px}
  .water-manual button{background:linear-gradient(135deg,var(--ac1),var(--ac2));color:#fff;border-radius:var(--radius-xs);padding:0 14px;font-weight:700;font-size:13px}
  .habit-type-row select{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-xs);padding:9px 10px}
  .habit-type-row input{width:130px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-xs);padding:9px 10px}

  /* ---------- summary ---------- */
  .seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;margin-bottom:16px}
  .seg button{flex:1;padding:8px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--muted)}
  .seg button.on{background:linear-gradient(135deg,var(--ac1),var(--ac2));color:#fff}
  .seg.small{margin-bottom:12px}
  .seg.small button{padding:6px;font-size:12.5px}

  .done-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;
    color:var(--muted);font-size:13.5px;font-weight:700;padding:10px 0;border-top:1px solid var(--surface-2);margin-top:6px}
  .done-toggle .arrow{transition:.2s ease}
  .done-toggle.open .arrow{transform:rotate(180deg)}
  .done-list{display:none}
  .done-list.open{display:block}
  .stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}
  .stat-box{background:var(--surface-2);border-radius:var(--radius-sm);padding:12px;text-align:center}
  .stat-box .n{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--ac-text)}
  .stat-box .l{font-size:11px;color:var(--muted);font-weight:600}
  .bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin:16px 0 6px}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
  .bar-col .bar{width:60%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--ac1),var(--ac2));min-height:3px}
  .bar-col .lbl{font-size:10.5px;color:var(--faint);font-weight:700}
  .cat-list{margin-top:6px}
  .cat-row{display:flex;align-items:center;gap:10px;padding:7px 0}
  .cat-row .name{width:78px;font-size:13px;color:var(--muted);flex:0 0 auto}
  .cat-row .track{flex:1;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
  .cat-row .fill{height:100%;background:linear-gradient(90deg,var(--ac1),var(--ac2));border-radius:999px}
  .cat-row .num{font-size:12px;font-weight:700;color:var(--faint);width:22px;text-align:right}

  /* ---------- notes ---------- */
  .note-type-seg{display:flex;gap:8px;margin-bottom:14px}
  .note-type-seg button{padding:7px 16px;border-radius:999px;font-size:13px;font-weight:700;
    background:var(--surface-2);color:var(--muted)}
  .note-type-seg button.on{background:linear-gradient(135deg,var(--ac1),var(--ac2));color:#fff}
  .note{border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;background:var(--surface)}
  .note input.note-title{width:100%;border:none;background:transparent;font-size:16px;font-weight:700;margin-bottom:6px}
  .note textarea{width:100%;border:none;background:transparent;resize:vertical;min-height:52px;font-size:14.5px;
    line-height:1.55;color:var(--muted)}
  .note-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .note-foot .stamp{font-size:11px;color:var(--faint)}
  .note-foot .right{display:flex;align-items:center;gap:12px}
  .note.pinned{border-color:var(--ac-solid)}
  .pin-btn{font-size:13px;color:var(--faint)}
  .pin-btn.on{color:var(--ac-text);font-weight:700}

  .hint{font-size:12px;color:var(--faint);margin-top:12px;line-height:1.5}
  .loading{text-align:center;color:var(--faint);padding:60px 0;font-style:italic;font-family:var(--font-display);font-size:18px}
</style>

<div class="topbar">
  <div class="controls">
    <button class="theme-btn" id="themeBtn">☀︎</button>
    <div class="swatch-row" id="swatchRow">
      <button class="swatch" data-a="green"></button>
      <button class="swatch" data-a="blue"></button>
      <button class="swatch" data-a="pink"></button>
      <button class="swatch" data-a="gray"></button>
    </div>
  </div>
</div>

<header>
  <div class="greeting" id="greeting">загружаю…</div>
  <div class="today-date" id="todayDate"></div>
</header>

<main id="app"><div class="loading">минуту…</div></main>

<script>
(function(){
  "use strict";

  /* ---------- storage ---------- */
  var mem={};
  var TG = window.Telegram && window.Telegram.WebApp;
  var CS = TG && TG.CloudStorage;
  var store={
    async get(k){
      if(CS){
        return new Promise(function(resolve){
          try{ CS.getItem(k, function(err, value){ resolve(err ? null : (value || null)); }); }
          catch(e){ resolve(null); }
        });
      }
      if(window.storage && window.storage.get){ try{var r=await window.storage.get(k); return r?r.value:null;}catch(e){return null;} }
      return (k in mem) ? mem[k] : null;
    },
    async set(k,v){
      if(CS){
        return new Promise(function(resolve){
          try{ CS.setItem(k, v, function(err, ok){ resolve(!!ok); }); }
          catch(e){ resolve(false); }
        });
      }
      if(window.storage && window.storage.set){ try{await window.storage.set(k,v); return;}catch(e){} }
      mem[k]=v;
    }
  };
  // state is split across keys because Telegram CloudStorage limits each value to 4096 characters
  var KEYS={ tasks:"planner_tasks", habits:"planner_habits", notes:"planner_notes", meta:"planner_meta" };

  var state={ tasks:[], habits:[], notes:[], theme:"light", accent:"green", lastMotivShown:"",
    categories:["Личное","Работа","Обучение"] };
  var view="main"; // main | habits | summary | notes
  var calMonth=null, selDate=null;
  var summaryRange="day";
  var noteFilter="note";

  var saveTimer=null;
  function save(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){
      store.set(KEYS.tasks, JSON.stringify(state.tasks));
      store.set(KEYS.habits, JSON.stringify(state.habits));
      store.set(KEYS.notes, JSON.stringify(state.notes));
      store.set(KEYS.meta, JSON.stringify({
        theme:state.theme, accent:state.accent, lastMotivShown:state.lastMotivShown, categories:state.categories
      }));
    },250);
  }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  var esc=function(s){ return (s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); };

  /* ---------- dates ---------- */
  function pad(n){return (n<10?"0":"")+n;}
  function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
  function today(){return iso(new Date());}
  var WD=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
  var WD_SHORT=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
  var MONTHS=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
  var MONTHS_GEN=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  function fmtLong(dstr){ var d=new Date(dstr+"T00:00"); return d.getDate()+" "+MONTHS_GEN[d.getMonth()]; }
  function mondayIndex(d){return (d.getDay()+6)%7;}
  function startOfWeek(d){var x=new Date(d); x.setDate(x.getDate()-mondayIndex(x)); x.setHours(0,0,0,0); return x;}
  function plural(n,one,few,many){ var n10=n%10,n100=n%100;
    if(n10===1&&n100!==11) return one; if(n10>=2&&n10<=4&&(n100<10||n100>=20)) return few; return many; }

  var MOTIVATIONS=[
    "Маленький шаг сегодня — это всё, что нужно.",
    "Не обязательно всё — достаточно следующего.",
    "Ты уже начала. Это самое трудное позади.",
    "Тихий день тоже считается.",
    "Красота в деталях, которые ты замечаешь."
  ];

  /* ---------- theme / accent ---------- */
  function applyTheme(){
    document.documentElement.setAttribute("data-theme", state.theme);
    document.documentElement.setAttribute("data-accent", state.accent);
    document.getElementById("themeBtn").textContent = state.theme==="light" ? "☀︎" : "☾";
    document.querySelectorAll(".swatch").forEach(function(s){
      s.classList.toggle("sel", s.getAttribute("data-a")===state.accent);
    });
  }
  document.getElementById("themeBtn").addEventListener("click",function(){
    state.theme = state.theme==="light" ? "dark" : "light"; applyTheme(); save();
  });
  document.getElementById("swatchRow").addEventListener("click",function(e){
    var b=e.target.closest(".swatch"); if(!b) return;
    state.accent=b.getAttribute("data-a"); applyTheme(); save();
  });

  /* ---------- header ---------- */
  function renderHeader(){
    var d=new Date(), h=d.getHours();
    var g = h<5?"доброй ночи":h<12?"доброе утро":h<18?"добрый день":"добрый вечер";
    document.getElementById("greeting").textContent=g+", Инна";
    document.getElementById("todayDate").innerHTML=
      '<span class="day-word">'+WD[d.getDay()].toLowerCase()+'</span>, '+d.getDate()+" "+MONTHS_GEN[d.getMonth()];
  }

  /* ---------- motivation popup ---------- */
  function maybeShowMotivation(){
    var t=today();
    if(state.lastMotivShown===t) return;
    var phrase=MOTIVATIONS[Math.floor(Math.random()*MOTIVATIONS.length)];
    var ov=document.createElement("div");
    ov.className="motiv-overlay";
    ov.innerHTML='<div class="motiv-card"><div class="mark"></div><p>'+esc(phrase)+'</p>'+
      '<button class="close" id="motivClose">Хорошего дня</button></div>';
    document.body.appendChild(ov);
    document.getElementById("motivClose").addEventListener("click",function(){
      ov.remove(); state.lastMotivShown=t; save();
    });
  }

  /* ---------- render dispatch ---------- */
  var app=document.getElementById("app");
  function render(){
    if(view==="main") renderMain();
    else if(view==="habits") renderHabits();
    else if(view==="summary") renderSummary();
    else if(view==="notes") renderNotes();
    else if(view==="archive") renderArchive();
  }

  function priorityChip(p){
    var map={low:["pr-low","низкий"],medium:["pr-medium","средний"],high:["pr-high","высокий"]};
    var v=map[p]||map.medium;
    return '<span class="chip '+v[0]+'">'+v[1]+'</span>';
  }
  function statusChip(s){
    var map={todo:["st-todo","к выполнению"],progress:["st-progress","в процессе"],done:["st-done","готово"]};
    var v=map[s]||map.todo;
    return '<span class="chip '+v[0]+'">'+v[1]+'</span>';
  }

  function taskRowHTML(x){
    var chips='';
    if(x.date) chips+='<span class="chip deadline">до '+fmtLong(x.date)+'</span>';
    if(x.category) chips+='<span class="chip">'+esc(x.category)+'</span>';
    chips+=priorityChip(x.priority);
    chips+=statusChip(x.status);
    return '<div class="row '+(x.status==="done"?"done":"")+'">'+
      '<button class="check '+(x.status==="done"?"on":"")+'" data-toggle="'+x.id+'"></button>'+
      '<div class="body"><div class="txt">'+(x.time?'<span class="chip">'+esc(x.time)+'</span> ':'')+esc(x.text)+'</div>'+
      '<div class="meta-chips">'+chips+'</div></div>'+
      '<button class="del" data-del="'+x.id+'">×</button></div>';
  }

  function addFormHTML(prefillDate, idp){
    idp = idp || "add";
    return '<button class="add-toggle" id="'+idp+'Toggle">+ добавить задачу</button>'+
      '<div class="add-form" id="'+idp+'Form">'+
        '<input class="text" id="'+idp+'Text" placeholder="что нужно сделать?">'+
        '<div class="add-grid">'+
          '<input type="date" id="'+idp+'Date" value="'+(prefillDate||"")+'">'+
          '<select id="'+idp+'Cat">'+categoryOptionsHTML()+'<option value="__new">+ добавить категорию</option></select>'+
          '<select id="'+idp+'Priority"><option value="low">приоритет: низкий</option><option value="medium" selected>приоритет: средний</option><option value="high">приоритет: высокий</option></select>'+
          '<select id="'+idp+'Status"><option value="todo" selected>к выполнению</option><option value="progress">в процессе</option><option value="done">готово</option></select>'+
          '<div class="newcat-row" id="'+idp+'NewcatRow"><input id="'+idp+'NewcatInput" placeholder="название категории"><button id="'+idp+'NewcatBtn">Добавить</button></div>'+
        '</div>'+
        '<button class="add-btn" id="'+idp+'Btn">Добавить</button>'+
      '</div>';
  }

  function categoryOptionsHTML(){
    return state.categories.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join("");
  }

  function wireAddForm(defaultDate, idp){
    idp = idp || "add";
    var tgl=document.getElementById(idp+"Toggle"), form=document.getElementById(idp+"Form");
    if(!tgl) return;
    tgl.addEventListener("click",function(){ form.classList.toggle("open"); });
    var catSel=document.getElementById(idp+"Cat"), newRow=document.getElementById(idp+"NewcatRow");
    catSel.addEventListener("change",function(){
      if(catSel.value==="__new"){ newRow.classList.add("open"); document.getElementById(idp+"NewcatInput").focus(); }
      else { newRow.classList.remove("open"); }
    });
    document.getElementById(idp+"NewcatBtn").addEventListener("click",function(){
      var v=document.getElementById(idp+"NewcatInput").value.trim(); if(!v) return;
      if(state.categories.indexOf(v)===-1) state.categories.push(v);
      save();
      catSel.innerHTML=categoryOptionsHTML()+'<option value="__new">+ добавить категорию</option>';
      catSel.value=v; newRow.classList.remove("open");
    });
    document.getElementById(idp+"Btn").addEventListener("click",function(){
      var v=document.getElementById(idp+"Text").value.trim(); if(!v) return;
      var cat=catSel.value==="__new" ? "" : catSel.value;
      state.tasks.push({
        id:uid(), text:v,
        date:document.getElementById(idp+"Date").value||defaultDate||today(),
        category:cat,
        priority:document.getElementById(idp+"Priority").value,
        status:document.getElementById(idp+"Status").value,
        time:""
      });
      save(); render();
    });
  }

  function wireTaskEvents(){
    app.querySelectorAll("[data-toggle]").forEach(function(b){
      b.addEventListener("click",function(){
        var x=state.tasks.find(function(t){return t.id===b.getAttribute("data-toggle");});
        if(x){ x.status = x.status==="done" ? "todo" : "done"; save(); render(); }
      });
    });
    app.querySelectorAll("[data-del]").forEach(function(b){
      b.addEventListener("click",function(){
        state.tasks=state.tasks.filter(function(t){return t.id!==b.getAttribute("data-del");});
        save(); render();
      });
    });
  }

  var mainSort="date";
  function sortTasks(arr, mode){
    var arr2=arr.slice();
    if(mode==="category") arr2.sort(function(a,b){ return (a.category||"").localeCompare(b.category||"","ru"); });
    else if(mode==="priority"){ var order={high:0,medium:1,low:2}; arr2.sort(function(a,b){ return (order[a.priority]!==undefined?order[a.priority]:1)-(order[b.priority]!==undefined?order[b.priority]:1); }); }
    else arr2.sort(function(a,b){ return (a.date||"").localeCompare(b.date||"") || (a.time||"99").localeCompare(b.time||"99"); });
    return arr2;
  }

  var doneOpen=false;

  /* ================= MAIN (today + calendar + hub tiles) ================= */
  function renderMain(){
    var t=today();
    var active=sortTasks(state.tasks.filter(function(x){ return x.date===t && x.status!=="done"; }), mainSort);
    var doneToday=state.tasks.filter(function(x){ return x.date===t && x.status==="done"; });

    var html='<div class="card"><div class="card-title"><h2>Активные задачи</h2>'+
      '<span class="count">'+active.length+'</span></div>';
    html+='<div class="seg small" id="sortSeg">'+
      '<button data-s="date" class="'+(mainSort==="date"?"on":"")+'">По дате</button>'+
      '<button data-s="category" class="'+(mainSort==="category"?"on":"")+'">По категории</button>'+
      '<button data-s="priority" class="'+(mainSort==="priority"?"on":"")+'">По приоритету</button>'+
      '</div>';
    html+= active.length ? active.map(taskRowHTML).join("") : '<div class="empty">пусто — и это тоже нормально</div>';
    html+= addFormHTML(t,"add");
    html+='<button class="done-toggle '+(doneOpen?"open":"")+'" id="doneToggle">'+
      '<span>Выполнено сегодня ('+doneToday.length+')</span><span class="arrow">⌄</span></button>';
    html+='<div class="done-list '+(doneOpen?"open":"")+'">'+
      (doneToday.length ? doneToday.map(taskRowHTML).join("") : '<div class="empty">пока ничего не отмечено</div>')+
      '</div>';
    html+='</div>';

    html+= calendarHTML();

    html+='<div class="tiles">'+
      '<button class="tile t1" data-go="habits"><span class="ic">◐</span><div><div class="lbl">Привычки</div><div class="sub">трекер за месяц</div></div></button>'+
      '<button class="tile t2" data-go="summary"><span class="ic">▤</span><div><div class="lbl">Итоги</div><div class="sub">день · неделя · месяц</div></div></button>'+
      '<button class="tile t3" data-go="notes"><span class="ic">✎</span><div><div class="lbl">Заметки</div><div class="sub">важное и дневник</div></div></button>'+
      '<button class="tile t4" data-go="archive"><span class="ic">🗄</span><div><div class="lbl">Выполненные</div><div class="sub">хранилище задач</div></div></button>'+
      '</div>';

    app.innerHTML=html;
    wireAddForm(t,"add");
    wireTaskEvents();
    wireCalendar();
    document.getElementById("sortSeg").addEventListener("click",function(e){
      var b=e.target.closest("button"); if(!b) return; mainSort=b.getAttribute("data-s"); render();
    });
    document.getElementById("doneToggle").addEventListener("click",function(){ doneOpen=!doneOpen; render(); });
    app.querySelectorAll("[data-go]").forEach(function(b){
      b.addEventListener("click",function(){ view=b.getAttribute("data-go"); render(); });
    });
  }

  function calendarHTML(){
    if(!calMonth){ var n=new Date(); calMonth={y:n.getFullYear(),m:n.getMonth()}; }
    var y=calMonth.y,m=calMonth.m,t=today();
    var first=new Date(y,m,1), lead=mondayIndex(first), days=new Date(y,m+1,0).getDate();
    var counts={}; state.tasks.forEach(function(x){ if(x.date) counts[x.date]=(counts[x.date]||0)+1; });

    var html='<div class="card"><div class="cal-head">'+
      '<button class="nav-btn" id="prevM">‹</button><h2>'+MONTHS[m]+" "+y+'</h2>'+
      '<button class="nav-btn" id="nextM">›</button></div><div class="cal-grid">';
    WD_SHORT.slice(1).concat(WD_SHORT[0]).forEach(function(w){ html+='<div class="cal-wd">'+w+'</div>'; });
    for(var i=0;i<lead;i++) html+='<div class="cal-cell blank"></div>';
    for(var d=1;d<=days;d++){
      var ds=iso(new Date(y,m,d));
      var isToday=ds===t, isSel=ds===selDate, has=counts[ds];
      html+='<div class="cal-cell '+(isSel?"sel":"")+'" data-day="'+ds+'">'+
        (isToday?'<span class="today-mark">'+handCircleSVG()+'</span>':'')+
        d+(has&&!isSel?'<span class="dot"></span>':'')+
        '</div>';
    }
    html+='</div>';
    if(selDate){
      var items=state.tasks.filter(function(x){return x.date===selDate;})
        .sort(function(a,b){return (a.time||"99").localeCompare(b.time||"99");});
      html+='<div class="day-panel"><h3>'+fmtLong(selDate)+'</h3>';
      html+= items.length ? items.map(taskRowHTML).join("") : '<div class="empty">на этот день пока ничего</div>';
      html+= addFormHTML(selDate,"day");
      html+='</div>';
    } else {
      html+='<div class="hint">Нажми на день, чтобы увидеть дела и встречи.</div>';
    }
    html+='</div>';
    return html;
  }

  function handCircleSVG(){
    return '<img src="'+CIRCLE_IMG+'" alt="" style="width:100%;height:100%;object-fit:contain;display:block">';
  }
  function wireCalendar(){
    document.getElementById("prevM").addEventListener("click",function(){ calMonth.m--; if(calMonth.m<0){calMonth.m=11;calMonth.y--;} render(); });
    document.getElementById("nextM").addEventListener("click",function(){ calMonth.m++; if(calMonth.m>11){calMonth.m=0;calMonth.y++;} render(); });
    app.querySelectorAll("[data-day]").forEach(function(b){
      b.addEventListener("click",function(){ selDate = (selDate===b.getAttribute("data-day")) ? null : b.getAttribute("data-day"); render(); });
    });
    if(selDate) wireAddForm(selDate,"day");
  }
  function backBtnHTML(){ return '<div class="back" id="backBtn">← на главную</div>'; }
  function wireBack(){ document.getElementById("backBtn").addEventListener("click",function(){ view="main"; render(); }); }

  /* ================= ARCHIVE (completed tasks storage) ================= */
  function renderArchive(){
    var done=state.tasks.filter(function(x){ return x.status==="done"; })
      .sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
    var html=backBtnHTML()+'<div class="card"><div class="card-title"><h2>Выполненные</h2>'+
      '<span class="count">'+done.length+'</span></div>';
    if(!done.length){
      html+='<div class="empty">Здесь будут копиться выполненные задачи — ничего пока нет.</div>';
    } else {
      var lastDate=null;
      done.forEach(function(x){
        if(x.date!==lastDate){ html+='<div class="habit-sub" style="margin-top:14px">'+fmtLong(x.date)+'</div>'; lastDate=x.date; }
        html+=taskRowHTML(x);
      });
    }
    html+='</div>';
    app.innerHTML=html; wireBack();
    wireTaskEvents();
  }

  /* ================= HABITS ================= */
  function daysBetween(a,b){ return Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/86400000); }
  function fmtNum(n){ var r=Math.round(n*100)/100; return (r%1===0)?r.toFixed(0):String(r).replace(".",","); }
  function habitReached(hb,ds){ return hb.kind==="check" ? !!hb.checks[ds] : (hb.progress[ds]||0) >= (hb.goal||1); }
  function habitStreak(hb){
    var t=today(), d=new Date(t+"T00:00");
    if(!habitReached(hb, iso(d))) d.setDate(d.getDate()-1);
    var count=0;
    while(iso(d) >= hb.start && habitReached(hb, iso(d))){ count++; d.setDate(d.getDate()-1); }
    return count;
  }
  function streakBadgeHTML(n){
    if(n<=0) return '';
    var word=plural(n,"день","дня","дней");
    var label = n===1 ? ('первый день — поехали!') : ('ура, '+n+' '+word+' подряд!');
    return '<div class="streak-badge">🔥 '+label+'</div>';
  }

  function renderHabits(){
    var t=today();
    var html=backBtnHTML()+'<div class="card"><div class="card-title"><h2>Привычки</h2></div>';
    if(!state.habits.length) html+='<div class="empty">Добавь первую привычку — например «стакан воды утром».</div>';
    state.habits.forEach(function(hb){
      hb.kind=hb.kind||"check";
      hb.checks=hb.checks||{}; hb.progress=hb.progress||{};
      hb.start=hb.start||t;
      var totalDays=daysBetween(hb.start,t)+1;
      var doneCount=0;
      for(var k=0;k<totalDays;k++){
        var kd=iso(new Date(new Date(hb.start+"T00:00").getTime()+k*86400000));
        var reached = hb.kind==="check" ? !!hb.checks[kd] : (hb.progress[kd]||0) >= (hb.goal||1);
        if(reached) doneCount++;
      }
      var pct=Math.round(doneCount/totalDays*100);

      html+='<div class="habit"><div class="habit-head">'+
        '<input class="habit-name-input" data-hname="'+hb.id+'" value="'+esc(hb.name)+'" placeholder="название привычки">'+
        '<span class="habit-pct">'+pct+'%</span>'+
        '<button class="del" data-del-habit="'+hb.id+'" style="opacity:.5">×</button></div>';
      html+='<div class="habit-sub">день 1 — '+fmtLong(hb.start)+' · сегодня день '+totalDays+'</div>';
      html+=streakBadgeHTML(habitStreak(hb));

      if(hb.kind==="water"){
        var goal=hb.goal||2.6, amt=hb.progress[t]||0, fillPct=Math.min(100,Math.round(amt/goal*100));
        html+='<div class="water-row"><div class="water-glass"><div class="water-fill" style="height:'+fillPct+'%"></div></div>'+
          '<div class="water-info"><div class="water-amt">'+fmtNum(amt)+' / '+fmtNum(goal)+' л</div>'+
          '<div class="water-goal">сегодня выпито</div>'+
          '<div class="water-actions">'+
            '<button class="qbtn" data-water="'+hb.id+'" data-add="0.25">+0,25 л</button>'+
            '<button class="qbtn" data-water="'+hb.id+'" data-add="0.5">+0,5 л</button>'+
            '<button class="qbtn" data-water="'+hb.id+'" data-add="-0.25">−0,25 л</button>'+
          '</div>'+
          '<div class="water-manual"><input type="number" step="0.05" min="0" placeholder="внести точно, л" id="waterManual_'+hb.id+'">'+
          '<button data-water-set="'+hb.id+'">Внести</button></div>'+
          '</div></div>';
      } else if(hb.kind==="steps"){
        var goalS=hb.goal||10000, amtS=hb.progress[t]||0, walkPct=Math.min(100,Math.round(amtS/goalS*100));
        html+='<div class="steps-info"><span class="steps-amt">'+amtS.toLocaleString("ru-RU")+'</span>'+
          '<span class="steps-goal">цель '+goalS.toLocaleString("ru-RU")+' шагов</span></div>'+
          '<div class="steps-path"><div class="steps-track"><span class="pt ptA"></span><span class="pt ptB"></span></div>'+
          '<span class="steps-walker" style="left:'+walkPct+'%">🚶</span></div>'+
          '<div class="steps-input-row"><input type="number" inputmode="numeric" placeholder="шагов сегодня" id="stepsInput_'+hb.id+'" value="'+(hb.progress[t]||"")+'">'+
          '<button data-steps-save="'+hb.id+'">Сохранить</button></div>';
      }

      html+='<div class="habit-grid">';
      for(var i=0;i<totalDays;i++){
        var ds=iso(new Date(new Date(hb.start+"T00:00").getTime()+i*86400000));
        var on = hb.kind==="check" ? hb.checks[ds] : (hb.progress[ds]||0) >= (hb.goal||1);
        var isToday=ds===t;
        var titleTxt = hb.kind==="check" ? ('день '+(i+1)+' · '+fmtLong(ds)) : ('день '+(i+1)+' · '+fmtLong(ds)+' · '+fmtNum(hb.progress[ds]||0)+' из '+fmtNum(hb.goal||0));
        if(hb.kind==="check"){
          html+='<button class="hdot '+(on?"on":"")+' '+(isToday?"today":"")+'" data-habit="'+hb.id+'" data-date="'+ds+'" title="'+titleTxt+'"></button>';
        } else {
          html+='<span class="hdot '+(on?"on":"")+' '+(isToday?"today":"")+'" title="'+titleTxt+'"></span>';
        }
      }
      html+='</div></div>';
    });
    html+='<div class="add-form open" style="margin-top:14px">'+
      '<div class="habit-type-row"><select id="habitKind">'+
        '<option value="check">обычная привычка</option>'+
        '<option value="water">трекер воды</option>'+
        '<option value="steps">трекер шагов</option></select>'+
      '<input id="habitGoal" type="number" step="0.1" placeholder="цель" style="display:none"></div>'+
      '<input class="text" id="habitText" placeholder="название привычки">'+
      '<button class="add-btn" id="habitBtn">Добавить</button></div></div>';
    app.innerHTML=html; wireBack();

    app.querySelectorAll("[data-hname]").forEach(function(inp){
      inp.addEventListener("input",function(){
        var hb=state.habits.find(function(h){return h.id===inp.getAttribute("data-hname");});
        if(hb){ hb.name=inp.value; save(); }
      });
    });
    app.querySelectorAll("[data-habit]").forEach(function(b){
      b.addEventListener("click",function(){
        var hb=state.habits.find(function(h){return h.id===b.getAttribute("data-habit");});
        var ds=b.getAttribute("data-date");
        hb.checks=hb.checks||{};
        if(hb.checks[ds]) delete hb.checks[ds]; else hb.checks[ds]=true;
        save(); render();
      });
    });
    app.querySelectorAll("[data-water]").forEach(function(b){
      b.addEventListener("click",function(){
        var hb=state.habits.find(function(h){return h.id===b.getAttribute("data-water");});
        var add=parseFloat(b.getAttribute("data-add"));
        hb.progress=hb.progress||{};
        var cur=hb.progress[t]||0;
        hb.progress[t]=Math.max(0, Math.round((cur+add)*100)/100);
        save(); render();
      });
    });
    app.querySelectorAll("[data-water-set]").forEach(function(b){
      b.addEventListener("click",function(){
        var hb=state.habits.find(function(h){return h.id===b.getAttribute("data-water-set");});
        var inp=document.getElementById("waterManual_"+hb.id);
        var v=parseFloat(inp.value);
        hb.progress=hb.progress||{};
        hb.progress[t]= isNaN(v) ? 0 : Math.max(0,v);
        save(); render();
      });
    });
    app.querySelectorAll("[data-steps-save]").forEach(function(b){
      b.addEventListener("click",function(){
        var hb=state.habits.find(function(h){return h.id===b.getAttribute("data-steps-save");});
        var inp=document.getElementById("stepsInput_"+hb.id);
        var v=parseInt(inp.value,10);
        hb.progress=hb.progress||{};
        hb.progress[t]= isNaN(v) ? 0 : Math.max(0,v);
        save(); render();
      });
    });
    app.querySelectorAll("[data-del-habit]").forEach(function(b){
      b.addEventListener("click",function(){
        state.habits=state.habits.filter(function(h){return h.id!==b.getAttribute("data-del-habit");});
        save(); render();
      });
    });

    var kindSel=document.getElementById("habitKind"), goalInp=document.getElementById("habitGoal"), ht=document.getElementById("habitText");
    kindSel.addEventListener("change",function(){
      if(kindSel.value==="water"){ goalInp.style.display=""; goalInp.placeholder="цель, л (например 2.6)"; goalInp.value="2.6"; if(!ht.value) ht.value="Вода"; }
      else if(kindSel.value==="steps"){ goalInp.style.display=""; goalInp.placeholder="цель, шагов"; goalInp.value="10000"; if(!ht.value) ht.value="Шаги"; }
      else { goalInp.style.display="none"; }
    });
    var hb2=document.getElementById("habitBtn");
    function addH(){
      var v=ht.value.trim(); if(!v) return;
      var kind=kindSel.value;
      var habit={id:uid(),name:v,checks:{},progress:{},start:today(),kind:kind};
      if(kind!=="check"){ habit.goal=parseFloat(goalInp.value)|| (kind==="water"?2.6:10000); }
      state.habits.push(habit); save(); render();
    }
    hb2.addEventListener("click",addH);
    ht.addEventListener("keydown",function(e){ if(e.key==="Enter") addH(); });
  }

  /* ================= SUMMARY ================= */
  function renderSummary(){
    var html=backBtnHTML()+'<div class="card"><div class="card-title"><h2>Итоги</h2></div>'+
      '<div class="seg" id="rangeSeg">'+
        '<button data-r="day" class="'+(summaryRange==="day"?"on":"")+'">День</button>'+
        '<button data-r="week" class="'+(summaryRange==="week"?"on":"")+'">Неделя</button>'+
        '<button data-r="month" class="'+(summaryRange==="month"?"on":"")+'">Месяц</button>'+
      '</div>';

    var t=today(), now=new Date();
    var rangeTasks, bars=[], barLabel;
    if(summaryRange==="day"){
      rangeTasks=state.tasks.filter(function(x){return x.date===t;});
      for(var h=0;h<4;h++){ bars.push({l:(h*6)+"–"+(h*6+6),v: rangeTasks.length? Math.round(Math.random()*0):0}); }
    } else if(summaryRange==="week"){
      var sow=startOfWeek(now);
      for(var i=0;i<7;i++){
        var d=new Date(sow.getFullYear(),sow.getMonth(),sow.getDate()+i), ds=iso(d);
        var dc=state.tasks.filter(function(x){return x.date===ds && x.status==="done";}).length;
        bars.push({l:WD_SHORT[d.getDay()], v:dc});
      }
      rangeTasks=state.tasks.filter(function(x){ return x.date>=iso(sow) && x.date<=iso(new Date(sow.getFullYear(),sow.getMonth(),sow.getDate()+6)); });
    } else {
      var y=now.getFullYear(),m=now.getMonth(), days=new Date(y,m+1,0).getDate();
      var weeks=[0,0,0,0,0];
      rangeTasks=state.tasks.filter(function(x){ return x.date && x.date.slice(0,7)===y+"-"+pad(m+1); });
      rangeTasks.forEach(function(x){ if(x.status==="done"){ var dd=parseInt(x.date.slice(8,10),10); weeks[Math.min(4,Math.floor((dd-1)/7))]++; } });
      weeks.forEach(function(v,idx){ bars.push({l:"нед "+(idx+1), v:v}); });
    }
    var total=rangeTasks.length, done=rangeTasks.filter(function(x){return x.status==="done";}).length;
    var rate= total ? Math.round(done/total*100) : 0;

    html+='<div class="stat-row">'+
      '<div class="stat-box"><div class="n">'+total+'</div><div class="l">всего задач</div></div>'+
      '<div class="stat-box"><div class="n">'+done+'</div><div class="l">выполнено</div></div>'+
      '<div class="stat-box"><div class="n">'+rate+'%</div><div class="l">завершено</div></div>'+
      '</div>';

    var maxV=Math.max.apply(null, bars.map(function(b){return b.v;}).concat([1]));
    html+='<div class="bars">'+bars.map(function(b){
      var hpct = Math.max(4, Math.round(b.v/maxV*100));
      return '<div class="bar-col"><div class="bar" style="height:'+hpct+'%"></div><span class="lbl">'+b.l+'</span></div>';
    }).join("")+'</div>';

    var cats={};
    rangeTasks.forEach(function(x){ var c=x.category||"без категории"; cats[c]=(cats[c]||0)+1; });
    var catKeys=Object.keys(cats);
    if(catKeys.length){
      var maxC=Math.max.apply(null, catKeys.map(function(k){return cats[k];}));
      html+='<div class="cat-list">';
      catKeys.forEach(function(k){
        html+='<div class="cat-row"><span class="name">'+esc(k)+'</span>'+
          '<div class="track"><div class="fill" style="width:'+Math.round(cats[k]/maxC*100)+'%"></div></div>'+
          '<span class="num">'+cats[k]+'</span></div>';
      });
      html+='</div>';
    } else {
      html+='<div class="empty">за этот период задач пока нет</div>';
    }
    html+='</div>';
    app.innerHTML=html; wireBack();
    document.getElementById("rangeSeg").addEventListener("click",function(e){
      var b=e.target.closest("button"); if(!b) return; summaryRange=b.getAttribute("data-r"); render();
    });
  }

  /* ================= NOTES ================= */
  function renderNotes(){
    var filtered=state.notes.filter(function(n){ return n.type===noteFilter; });
    var html=backBtnHTML()+'<div class="card"><div class="card-title"><h2>Заметки</h2><span class="count">'+filtered.length+'</span></div>'+
      '<div class="note-type-seg">'+
        '<button data-nf="note" class="'+(noteFilter==="note"?"on":"")+'">Важное</button>'+
        '<button data-nf="diary" class="'+(noteFilter==="diary"?"on":"")+'">Дневник</button>'+
      '</div>'+
      '<button class="add-btn" id="newNote" style="margin-bottom:14px">+ новая запись</button>';
    if(!filtered.length) html+='<div class="empty">'+(noteFilter==="note"?"Здесь хорошо оставлять важные мысли и списки.":"Записывай сюда день — коротко или подробно, как захочется.")+'</div>';
    var sorted=filtered.slice().reverse().sort(function(a,b){ return (b.pinned?1:0)-(a.pinned?1:0); });
    sorted.forEach(function(nt){
      html+='<div class="note '+(nt.pinned?"pinned":"")+'"><input class="note-title" data-nt-title="'+nt.id+'" value="'+esc(nt.title)+'" placeholder="Заголовок">'+
        '<textarea data-nt-body="'+nt.id+'" placeholder="…">'+esc(nt.body)+'</textarea>'+
        '<div class="note-foot"><span class="stamp">'+nt.stamp+'</span>'+
        '<span class="right"><button class="pin-btn '+(nt.pinned?"on":"")+'" data-pin-note="'+nt.id+'">'+(nt.pinned?"📌 закреплено":"📌 закрепить")+'</button>'+
        '<button class="del" data-del-note="'+nt.id+'" style="opacity:.5">удалить</button></span></div></div>';
    });
    html+='</div>';
    app.innerHTML=html; wireBack();

    document.querySelectorAll("[data-nf]").forEach(function(b){
      b.addEventListener("click",function(){ noteFilter=b.getAttribute("data-nf"); render(); });
    });
    document.getElementById("newNote").addEventListener("click",function(){
      state.notes.push({id:uid(),title:"",body:"",stamp:fmtLong(today()),type:noteFilter}); save(); render();
    });
    app.querySelectorAll("[data-nt-title]").forEach(function(inp){
      inp.addEventListener("input",function(){
        var nt=state.notes.find(function(n){return n.id===inp.getAttribute("data-nt-title");});
        if(nt){ nt.title=inp.value; save(); }
      });
    });
    app.querySelectorAll("[data-nt-body]").forEach(function(ta){
      ta.addEventListener("input",function(){
        var nt=state.notes.find(function(n){return n.id===ta.getAttribute("data-nt-body");});
        if(nt){ nt.body=ta.value; save(); }
      });
    });
    app.querySelectorAll("[data-del-note]").forEach(function(b){
      b.addEventListener("click",function(){
        state.notes=state.notes.filter(function(n){return n.id!==b.getAttribute("data-del-note");});
        save(); render();
      });
    });
    app.querySelectorAll("[data-pin-note]").forEach(function(b){
      b.addEventListener("click",function(){
        var nt=state.notes.find(function(n){return n.id===b.getAttribute("data-pin-note");});
        if(nt){ nt.pinned=!nt.pinned; save(); render(); }
      });
    });
  }

  /* ---------- boot ---------- */
  (async function(){
    if(TG){ try{ TG.ready(); TG.expand(); }catch(e){} }
    renderHeader();
    try{
      var rTasks=await store.get(KEYS.tasks);
      var rHabits=await store.get(KEYS.habits);
      var rNotes=await store.get(KEYS.notes);
      var rMeta=await store.get(KEYS.meta);
      if(rTasks) state.tasks=JSON.parse(rTasks)||[];
      if(rHabits) state.habits=JSON.parse(rHabits)||[];
      if(rNotes) state.notes=JSON.parse(rNotes)||[];
      if(rMeta){
        var meta=JSON.parse(rMeta);
        state.theme=meta.theme||"light"; state.accent=meta.accent||"green"; state.lastMotivShown=meta.lastMotivShown||"";
        state.categories=meta.categories&&meta.categories.length?meta.categories:state.categories;
      }
    }catch(e){}
    applyTheme();
    render();
    maybeShowMotivation();
  })();
})();
</script>
